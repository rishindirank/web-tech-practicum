<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Services Toggle</title>
    <link rel="stylesheet" href="practicum15.css">
</head>
<body>

    <div class="container">

        <h1>ABC Banking Services</h1>

        <p class="description">
            Enable or Disable Digital Banking Services
        </p>

        <div class="toggle-container">

            <label class="switch">

                <input type="checkbox" id="digitalToggle">

                <span class="slider"></span>

            </label>

            <label for="digitalToggle">
                Digital Banking
            </label>

        </div>

        <div id="statusBox" class="status">
            Digital Banking is Disabled
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
